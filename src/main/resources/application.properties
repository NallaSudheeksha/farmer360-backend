server.port=${PORT:8080}

# MySQL (Render lo env variables vaadutundi, local lo default values vaadutundi)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmer360?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Errors and JWT
server.error.include-message=always
app.jwt.secret=${JWT_SECRET:farmer360-super-secret-key-change-me-1234567890}

# Crop photos are saved in this folder (created automatically)
app.upload-dir=uploads

# Image upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB