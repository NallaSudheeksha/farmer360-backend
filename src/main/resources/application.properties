server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/farmer360?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Errors and JWT
server.error.include-message=always
app.jwt.secret=farmer360-super-secret-key-change-me-1234567890

# Crop photos are saved in this folder (created automatically)
app.upload-dir=uploads

# Image upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB